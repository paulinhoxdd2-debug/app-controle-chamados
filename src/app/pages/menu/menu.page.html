<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Menu Principal 🛠️</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="sair()" color="danger">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="menu-grid animate-fade">
    <div class="menu-item tech-card" (click)="navegar('/cadastro-chamado')">
      <ion-icon name="add-circle-outline"></ion-icon>
      <span>Novo Chamado</span>
    </div>

    <div class="menu-item tech-card" (click)="navegar('/lista-chamados')">
      <ion-icon name="list-outline"></ion-icon>
      <span>Lista de Chamados</span>
    </div>

    <div class="menu-item tech-card" (click)="navegar('/cadastro-tecnico')">
      <ion-icon name="person-add-outline"></ion-icon>
      <span>Novo Técnico</span>
    </div>

    <div class="menu-item tech-card" (click)="navegar('/lista-tecnicos')">
      <ion-icon name="people-outline"></ion-icon>
      <span>Lista de Técnicos</span>
    </div>

    <div class="menu-item tech-card" (click)="navegar('/resumo')">
      <ion-icon name="pie-chart-outline"></ion-icon>
      <span>Resumo</span>
    </div>

    <div class="menu-item tech-card" (click)="navegar('/sobre')">
      <ion-icon name="information-circle-outline"></ion-icon>
      <span>Sobre</span>
    </div>
  </div>
</ion-content>
